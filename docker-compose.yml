services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/comptes.db
      # CF_ACCESS_AUD et CF_ACCESS_CERTS sont à renseigner si CF Access est actif
      # - CF_ACCESS_AUD=
      # - CF_ACCESS_CERTS_URL=https://<team>.cloudflareaccess.com/cdn-cgi/access/certs
